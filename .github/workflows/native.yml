name: Native libraries
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unix:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04
            target: x86_64-unknown-linux-gnu
            clang: /usr/bin/clang-22
            setup: --linux-gpu
          - os: macos-26
            target: aarch64-apple-darwin
            clang: /opt/homebrew/opt/llvm@22/bin/clang
            setup: ''
    runs-on: ${{ matrix.os }}
    env:
      SILK_CLANG: ${{ matrix.clang }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .cache
            ~/.silk/archives
          key: native-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('toolchains.lock.json', 'modules/gpu/webgpu/scripts/ci-lock.json') }}
      # A task is compiled code: bootstrap Clang before the first task can run.
      - name: Bootstrap LLVM 22 on macOS
        if: runner.os == 'macOS'
        run: |
          test -x /opt/homebrew/opt/llvm@22/bin/clang || brew install llvm@22
          test -x /opt/homebrew/opt/lld@22/bin/ld64.lld || brew install lld@22
          echo "/opt/homebrew/opt/lld@22/bin" >> "$GITHUB_PATH"
          echo "SDKROOT=$(xcrun --sdk macosx --show-sdk-path)" >> "$GITHUB_ENV"
      - name: Bootstrap pinned Silk
        env:
          SILK_RELEASE: v0.1.0-dev.64+8214c402307b
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          curl --fail --location --output "$RUNNER_TEMP/install-silk.sh" https://raw.githubusercontent.com/silk-lang/silk/8214c402307b/install.sh
          sh "$RUNNER_TEMP/install-silk.sh"
          echo "$HOME/.silk/bin" >> "$GITHUB_PATH"
      - name: Linux system and display prerequisites
        if: runner.os == 'Linux'
        run: silk task system-prerequisites
      - name: Select pinned native tooling
        run: silk task setup-ci ${{ matrix.setup }}
      - name: Check workspace, browser host contracts and headless tests
        run: silk task check-workspace
      - name: WebGPU ABI and native lifetime/validation scenarios
        run: silk task test-native
      - name: Cross-target declaration checks
        if: runner.os == 'Linux'
        run: silk task cross-check
      - name: Six native pixel and compute samples
        run: silk task native-pixels
      - name: Linux X11 and Wayland native windows
        if: runner.os == 'Linux'
        run: silk task --manifest-path modules/platform/window/silk.toml linux smoke
      - name: GLFW window build
        if: runner.os == 'Linux'
        run: silk build --manifest-path modules/gpu/webgpu/examples-window/silk.toml
      - name: Metal and AppKit execution
        if: runner.os == 'macOS'
        run: silk task test-macos
  browser:
    runs-on: ubuntu-26.04
    env:
      SILK_CLANG: /usr/bin/clang-22
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .cache
          key: browser-${{ runner.os }}-${{ hashFiles('toolchains.lock.json', 'modules/gpu/webgpu/scripts/ci-lock.json') }}
      - name: Bootstrap pinned Silk
        env:
          SILK_RELEASE: v0.1.0-dev.64+8214c402307b
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          curl --fail --location --output "$RUNNER_TEMP/install-silk.sh" https://raw.githubusercontent.com/silk-lang/silk/8214c402307b/install.sh
          sh "$RUNNER_TEMP/install-silk.sh"
          echo "$HOME/.silk/bin" >> "$GITHUB_PATH"
      - run: silk task system-prerequisites --browser
      - run: silk task setup-ci --browser
      # Ubuntu's AppArmor profile denies unprivileged user namespaces, which Chromium's sandbox
      # needs. Without this Chromium aborts at startup with "No usable sandbox".
      - name: Allow the Chromium sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Compile real wasm applications and exercise canvas surfaces
        run: silk task test-browser
  windows:
    runs-on: windows-2025-vs2026
    timeout-minutes: 60
    env:
      SILK_HOME: ${{ github.workspace }}\.silk-home
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        id: native-cache
        with:
          path: |
            .cache
            .silk-home/archives
            ${{ runner.temp }}/silk-bootstrap-llvm
          key: native-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('toolchains.lock.json') }}
      # This pinned compiler prerequisite cannot itself be installed by a compiled task.
      - name: Bootstrap pinned LLVM 22
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: |
          $asset = (Get-Content toolchains.lock.json -Raw | ConvertFrom-Json).llvm.platforms.'x86_64-pc-windows-msvc'
          $archive = "$env:RUNNER_TEMP/llvm.tar.xz"
          $directory = "$env:RUNNER_TEMP/silk-bootstrap-llvm"
          curl.exe --fail --location --silent --show-error --output $archive $asset.url
          if ($LASTEXITCODE -ne 0) { throw 'LLVM bootstrap download failed' }
          if ((Get-Item $archive).Length -ne $asset.bytes -or (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $asset.sha256) { throw 'LLVM bootstrap checksum/size mismatch' }
          New-Item -ItemType Directory -Force $directory | Out-Null
          tar.exe -xf $archive --strip-components=1 -C $directory
          if ($LASTEXITCODE -ne 0) { throw 'LLVM bootstrap extraction failed' }
      - name: Select bootstrap compiler
        run: '"SILK_CLANG=$env:RUNNER_TEMP/silk-bootstrap-llvm/bin/clang.exe" | Out-File -FilePath $env:GITHUB_ENV -Append'
      - name: Bootstrap pinned Silk
        env:
          SILK_RELEASE: v0.1.0-dev.64+8214c402307b
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          Invoke-WebRequest https://raw.githubusercontent.com/silk-lang/silk/8214c402307b/install.ps1 -OutFile "$env:RUNNER_TEMP/install-silk.ps1"
          & "$env:RUNNER_TEMP/install-silk.ps1"
          "$env:SILK_HOME/bin" | Out-File -FilePath $env:GITHUB_PATH -Append
      - run: silk task setup-ci
      - name: Prepare SDK bridge, Dawn DLL and runtime payloads
        run: silk task prepare-windows --runtime-directory build/llvm/x86_64-pc-windows-msvc/debug
      - name: Check workspace and headless tests
        run: silk task check-workspace
      - name: ABI, native runtime, pixels and Win32 windows
        run: silk task test-windows
